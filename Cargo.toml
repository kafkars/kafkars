[workspace]
members = [
  "crates/kafka-client-core",
  "crates/kafka-client-engine",
  "crates/kafka-client-guardrails",
  "crates/kafka-client-sim",
  "crates/kafka-client",
]
default-members = [
  "crates/kafka-client-core",
  "crates/kafka-client-engine",
  "crates/kafka-client-guardrails",
  "crates/kafka-client-sim",
  "crates/kafka-client",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/zsumz/kafka-client"

[workspace.dependencies]
bytes = "1.10"
kafka-client-core = { path = "crates/kafka-client-core" }
kafka-client-engine = { path = "crates/kafka-client-engine" }
kafka-client-sim = { path = "crates/kafka-client-sim" }
kafka-driver = { path = "../kafka-driver" }
kafka-wire = { path = "../kafka-protocol/crates/kafka-wire" }
kafka-wire-core = { path = "../kafka-protocol/crates/kafka-wire-core" }
kafka-wire-records = { path = "../kafka-protocol/crates/kafka-wire-records" }
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
future_not_send = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
unnecessary_wraps = "allow"
