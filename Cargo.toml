[workspace]
members = [
  "crates/kafka-client-core",
  "crates/kafka-client-engine",
  "crates/kafka-client-guardrails",
  "crates/kafka-client-sim",
  "crates/kafkars",
]
default-members = [
  "crates/kafka-client-core",
  "crates/kafka-client-engine",
  "crates/kafka-client-guardrails",
  "crates/kafka-client-sim",
  "crates/kafkars",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/kafkars/kafkars"

[workspace.dependencies]
bytebudget = "=0.0.1-rc.1"
bytes = "1.10"
kafka-client-core = { path = "crates/kafka-client-core", version = "0.0.1" }
kafka-client-engine = { path = "crates/kafka-client-engine", version = "0.0.1" }
kafka-client-sim = { path = "crates/kafka-client-sim" }
kafka-driver = { path = "../kafka-driver", version = "0.1.0-rc.1" }
kafka-wire = { path = "../kafka-protocol/crates/kafka-wire", version = "0.1.0-rc.2" }
kafka-wire-core = { path = "../kafka-protocol/crates/kafka-wire-core", version = "0.1.0-rc.2" }
kafka-wire-records = { path = "../kafka-protocol/crates/kafka-wire-records", version = "0.1.0-rc.2" }
ring = "0.17.14"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.8"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
future_not_send = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
unnecessary_wraps = "allow"
