[package]
name = "kafkars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A deterministic, runtime-neutral Rust client for Apache Kafka"
documentation = "https://docs.rs/kafkars"
readme = "README.md"
keywords = ["kafka", "streaming", "client", "messaging"]
categories = ["api-bindings", "network-programming"]
include = ["src/**", "examples/**", "README.md", "LICENSE"]
publish = ["crates-io"]

[lib]
name = "kafkars"
path = "src/lib.rs"

[dependencies]
bytes.workspace = true
kafka-client-engine.workspace = true
zeroize.workspace = true

[dev-dependencies]
kafka-wire.workspace = true
kafka-wire-core.workspace = true

[lints]
workspace = true
