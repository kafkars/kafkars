name: invalid token and revision
permissions: read
inputs:
  read-token:
    description: fixture token
    required: false
runs:
  using: composite
  steps:
    - name: Read reviewed revisions
      id: revisions
      shell: sh
      run: echo "unreviewed=HEAD" >> "$GITHUB_OUTPUT"
    - name: Check out kafka-driver
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: kafkars/kafka-driver
        ref: ${{ steps.revisions.outputs.driver }}
        path: kafka-driver
        token: ${{ github.token }}
        persist-credentials: false
    - name: Check out kafka-wire
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: kafkars/kafka-wire
        ref: ${{ steps.revisions.outputs.protocol }}
        path: kafka-protocol
        token: ${{ inputs.read-token }}
        persist-credentials: false
    - name: Attest reviewed sibling dependencies
      shell: bash
      run: "$GITHUB_ACTION_PATH/../../../scripts/check-dependency-provenance"
