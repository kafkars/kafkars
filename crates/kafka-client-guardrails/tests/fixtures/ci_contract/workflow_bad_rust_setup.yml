name: wrong Rust setup
on: push
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  rust-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka-client
    steps:
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Install floating Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Validate Rust style and documentation
        run: scripts/check-rust-lint
