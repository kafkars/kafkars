name: unaudited mutation gap
on: push
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka-client
    steps:
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./kafka-client/.github/actions/setup-rust
      - name: Insert unaudited dependency command
        run: cargo metadata --locked --format-version 1
      - name: Validate architecture
        run: scripts/check-architecture
