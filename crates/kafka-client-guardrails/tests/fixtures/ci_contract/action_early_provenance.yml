name: early provenance
runs:
  using: composite
  steps:
    - name: Driver
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: kafkars/kafka-driver
        ref: ${{ steps.revisions.outputs.driver }}
        path: kafka-driver
        persist-credentials: false
    - name: Attest too early
      shell: bash
      run: "$GITHUB_ACTION_PATH/../../../scripts/check-dependency-provenance"
    - name: Protocol
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: kafkars/kafka-wire
        ref: ${{ steps.revisions.outputs.protocol }}
        path: kafka-protocol
        persist-credentials: false
