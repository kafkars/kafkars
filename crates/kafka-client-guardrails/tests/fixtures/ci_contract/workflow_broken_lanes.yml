name: broken lanes
on: push

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka-client
    steps:
      - name: Architecture
        run: scripts/check-architecture
  rust-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka-client
    steps:
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./kafka-client/.github/actions/setup-rust
      - name: Lint directly
        run: cargo clippy
  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka-client
    steps:
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./kafka-client/.github/actions/setup-rust
  quality-gate:
    if: ${{ always() }}
    needs: [architecture, rust-lint, rust-test]
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          RUST_LINT_RESULT: ${{ needs['rust-lint'].result }}
          RUST_TEST_RESULT: ${{ needs['rust-test'].result }}
        run: |
          failures=0
          check_result() {
            if [[ "$2" != success ]]; then
              failures=$((failures + 1))
            fi
          }
          check_result architecture "$ARCHITECTURE_RESULT"
          check_result rust-lint "$RUST_LINT_RESULT"
          check_result rust-test "$RUST_TEST_RESULT"
          test "$failures" -eq 0
