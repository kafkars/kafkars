title = "Classic revocation events own linear completion"
statement = "The hosted classic-group event stream retains ordered PartitionsAssigned, PartitionsRevoked, and PartitionsLost transitions with the exact nonreused assignment epoch and ordered topic-partitions. Only a revoked transition transfers one linear completion capability for that exact epoch; creating or observing it starts no protocol work and captures no new timeout. Core owns one original absolute graceful-release deadline, exact acknowledgment before that boundary becomes the sole success terminal, and acknowledgment at or after the boundary, owner loss, or a stale epoch cannot resurrect or mutate the active assignment. The engine stages the event and lease as one bounded ownership transition, runs deadline loss before ordinary membership work, and retains terminal settlement until the exact assignment is retired. The Rust bridge moves one completion capability into one public ConsumerRevocation, reports contention without consuming retry ownership, and makes repeated completion inert only after success. Dropping ConsumerRevocation does not acknowledge it. The named runtime-neutral NextConsumerEvent owns one bounded existing group-notifier registration, arms before probing, rearms for semantic change without a missed-wake gap, runs application wakers only off-reactor, and treats Drop as observation abandonment while the retained event remains queued. This slice introduces no checkpoint acknowledgment, control, seek, explicit close or LeaveGroup, KIP-848 membership, callback, async runtime, generated protocol type, or driver authority."
