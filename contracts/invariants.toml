title = "Assigned-consumer claim, close, and receive observation are linear and bounded"
statement = "Every clone of one Engine shares one capacity-one assigned-consumer claim slot. Exactly one claim transfers the sole private port into a movable, non-clone, non-Sync engine handle; failed and concurrent claims leave the winning handle operational, while a separate retained closer preserves shutdown admission fencing. Close reserves one bounded completion generation before deterministic BeginClose admission and binds that generation to the exact core AcceptClose identity. Only matching CompleteClose publishes Closed; notifier backpressure retains the exact ready terminal for retry. Abnormal recovery publishes ExecutionUnavailable only after unique driver teardown. Close Future polling and blocking wait observe the same cell. Batch recv is a named linear Future and blocking wait over one capacity-one generation-fenced signal; it starts no Fetch, owns no deadline or bytes, registers readiness under the assigned-owner lock, services contention on unlock, runs wakers only on the notifier, cancels only exact observation on Drop, returns end-of-stream after admission close, and translates owner loss or fault into a stable error. A queued recv ticket services the current pending generation, so replacing a dropped observer cannot be stranded behind stale queued work. One exact capacity-two assigned-consumer notifier queue owns one close ticket and one coalesced recv-change ticket off the host and driver reactors without an async runtime."
