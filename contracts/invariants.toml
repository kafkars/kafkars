[[invariant]]
id = "CON-10"
title = "Classic broker rejections recover under exact fences"
statement = "Core preserves every nonzero signed Kafka error code and alone maps it by Join, Sync, or Heartbeat stage; COORDINATOR_LOAD_IN_PROGRESS is recoverable with the retained coordinator in all three stages, while dynamic Join v1 through v3 treats MEMBER_ID_REQUIRED and every unlisted or unknown error as fatal. Phase, cycle, and heartbeat-attempt fences are validated before time precedence, so stale facts cannot mutate the machine. Before its deadline, a recoverable rejection arms one positive-backoff schedule fenced by the rejected membership cycle and, for Heartbeat, the live assignment generation; coordinator rediscovery remains an opaque interpreter need, and a stable rejection revokes its exact assignment before ArmRejoin or Fatal. At or after the original Join or Sync cycle deadline, rejection follows ordinary terminal cycle loss; at or after the exact Heartbeat attempt deadline, it emits only the exact assignment revocation. Only the exact due schedule allocates the next nonreused cycle and a fresh internal absolute deadline; cycle or deadline exhaustion is retained as fatal state, Close discards a pending rejoin, and a retained fatal diagnostic survives Close."
