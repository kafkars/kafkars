id = "CON-10"
title = "Classic broker rejections recover under exact fences"
statement = "Core preserves every nonzero signed Kafka error code and alone maps it by Join, Sync, or Heartbeat stage; COORDINATOR_LOAD_IN_PROGRESS is recoverable with the retained coordinator in all three stages, while dynamic Join v1 through v3 treats MEMBER_ID_REQUIRED and every unlisted or unknown error as fatal. Phase, cycle, and heartbeat-attempt fences are validated before time precedence, so stale facts cannot mutate the machine. Before its deadline, a recoverable rejection arms one positive-backoff schedule fenced by the rejected membership cycle and, for Heartbeat, the live assignment generation; a stable rejection revokes its exact assignment before ArmRejoin or Fatal. The engine atomically installs core-authorized Retain schedules and applies exact fatal outcomes. Rediscover atomically installs the schedule and a per-group Join gate. Invalidation capacity is preflighted before stage-specific route extraction; absent Join, Sync, or Heartbeat route evidence preserves both pending-confirmation owners, and the gate remains closed. Applied and IgnoredStale are the only tested terminal permissions for the planned Join; Unavailable, CapacityReached, and completion failure remain distinct and cannot open it. A CapacityReached terminal never claims that an accepted token survived. Gated schedules are hidden from deadline selection and counted in shutdown quiescence; after driver shutdown, explicit recovery disposes retained completion-fault state and reopens unfinished gates. At or after the original Join or Sync cycle deadline, rejection follows ordinary terminal cycle loss; at or after the exact Heartbeat attempt deadline, it emits only the exact assignment revocation. Only the exact permitted due schedule allocates the next nonreused cycle and a fresh internal absolute deadline; cycle or deadline exhaustion is retained as fatal state, Close discards a pending rejoin, and a retained fatal diagnostic survives Close. No engine retry decision, retry clock, coordin