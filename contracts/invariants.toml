statement = "One capacity-reserved topic IncrementalAlterConfigs machine validates a nonempty ordered batch of unique topics with at least one nonempty unique key each; represents Set, Delete, Append, and Subtract with exact value presence; retains one original absolute deadline; emits only one concrete submit attempt; revalidates ordered topic correlation; assigns at most one terminal decision; preserves nonnegative throttle, exact signed broker codes, bounded-diagnostic facts, and authoritative delivery certainty; and terminates compatibility without retry, legacy AlterConfigs fallback, invalidation, cache authority, generated protocol types, or transport types. Its concrete engine owner canonicalizes request strings, uses the shared conservative operation charge plus an explicit terminal normalization ceiling, reserves one operation slot and terminal cell before machine construction, retains bytes through single terminal publication and observer reclamation, preserves untouched NotSent versus handed-off or submitted PossiblySent recovery, and joins the closed shared-admin notifier capacity. The engine constructs the real generated API-key 44 v0/v1 request with topic resource type 2, exact Set=0, Delete=1, Append=2, and Subtract=3 operation codes, null values only for Delete, caller order, and validate-only intent; restores generated resource results to request order; rejects negative throttle and malformed resource identity; preserves exact signed codes; and bounds nullable UTF-8 diagnostics before core ownership. One explicit-capacity tracked-call owner submits that request through kafka-driver on Route::AnyBroker in TrafficClass::Interactive with maximum version 1 and the original transport deadline; retains operation, plan, result limit, and route receipt; validates the selected v0/v1 version; and maps decode or correlation faults, retained overflow, driver deadline, compatibility, and transport terminals without retry, fallback, cache, invalidation, or a gene