title = "Direct Fetch protocol is bounded and raw-terminal fenced"
statement = "The direct-consumer Fetch seam builds one name-routed normal-consumer partition request with exact Kafka sentinels and validates isolation and byte settings. Each background-prefetch attempt derives both absolutes from one fresh engine boundary capture bound to the exact FetchReady fence, independently of later recv observation. Admission reserves bounded tracked-call capacity before driver submission, returns the exact prepared request under backpressure or local rejection, proves remaining original core-deadline time before request construction, caps broker max-wait to that remainder, and preserves the original transport deadline and LongPoll lane. The driver boundary retains the exact prepared request, monotonic observation, selected version, opaque route token, and raw generated response without correlation, normalization, decompression, or RecordBatch decoding. Two-phase settlement moves the raw terminal while the registry retains the route token; exact confirmation releases it and exact restoration is lossless. Directionally newer partition control or exact old-assignment revocation returns the prepared owner through a must-use stale drain while the driver call continues draining and later requires exact stale confirmation. Future and cross-partition control retain ownership, and completion corruption retains its exact prepared request until explicit post-driver-shutdown recovery. Composed normalization requires the driver-selected version to remain within v4-v12. Nonzero top-level or exactly correlated partition broker codes remain exact signed failures and short-circuit success-only session, throttle, and record decoding while retaining no application data. Successful normalization delegates RecordBatch decoding, CRC, and compression to kafka-wire-records, cumulatively bounds scratch generated and decoded storage, filters records below the requested offset, drops empty and control batches from delivery, advances only through complete batches including control or compacted-empty batches, ignores partial tails for advancement, and never regresses the requested offset. EngineConfig owns the read-uncommitted default and accepts only a closed pre-start override; the facade retains an optional closed value, translates an explicit choice once into engine configuration, and host startup translates once into the core owner. One immutable core-owned ReadIsolation is mapped exhaustively into both ListOffsets and Fetch; read-committed success requires a last stable offset, treats nullable aborted-transaction metadata as empty, orders retained aborted ranges by first offset, composes kafka-wire generated control schemas with kafka-wire-records batch ownership, bounds response-local active ranges, rejects malformed or unknown controls and batches at or after the last stable offset, hides only active aborted transactional records, and preserves complete filtered and control-batch advancement without a second decoder or persistent transaction cache. Before publication, stable descriptor capacity and visible byte spans must fit the pre-acquired hard output reservation; exact slack is reported and every local or retention failure returns the linear token."
