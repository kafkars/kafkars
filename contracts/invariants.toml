[[invariant]]
id = "SD-01"
title = "Shutdown closes admission before draining"
statement = "Shutdown closes producer and private consumer admission before draining. The privately hosted classic-group registry closes admission before its bounded turn, contributes its unsettled count to quiescence, and performs conservative recovery only after the unique driver owner is gone. Normal stop or fallback recovery transfers its exact bounded notifier owner to the common off-notifier finalizer. Emergency recovery attempts the shared driver barrier, unconditionally drops the unique driver and every tracked Produce owner, then releases engine bytes and publishes conservative core fallback. Native compression workers and every Drop-backed notifier owner are joined during finalization before one shared report is retained."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/execution_stop_test.rs::damaged_interpretation_still_settles_observers_conservatively",
  "crates/kafka-client-engine/src/producer/execution_stop_test.rs::planning_failure_replaces_the_live_core_before_fallback_publication",
