[[invariant]]
id = "CON-09"
title = "Classic heartbeats are assignment-fenced and host-driven"
statement = "The deterministic classic-group owner arms Heartbeat only while installing the exact matching Sync assignment and fences every attempt by membership cycle, assignment generation, and monotonic sequence. Core alone decides cadence, throttle-aware scheduling, attempt expiry, session liveness, and conservative assignment loss. The engine maps the core-emitted Deadline directly through the host clock's fixed epoch into one OperationDeadline without observing ambient time or reconstructing a relative timeout, then retains a linear Waiting, Prepared, Handoff, DriverOwned, or ConfirmationPending mechanism owner. Generated dynamic-member Heartbeat stays inside the kafka-wire v0-v2 protocol seam; bounded coordinator-routed Control submission uses the original transport deadline and a stable GroupId plus exact attempt identity. Raw terminals, accepted receipts, route tokens, completion faults, and shutdown recovery remain losslessly owned through two-phase settlement. Successful terminals schedule the next core-authorized cadence, while broker rejection, driver failure, malformed outcomes, expiry, and pre-semantic driver shutdown conservatively revoke the exact assignment; confirmation-pending recovery never reapplies a successful core transition. Embedded host turns schedule the earliest heartbeat or membership deadline and count accepted heartbeat ownership during close. This slice introduces no heartbeat retry, rejoin, coordinator invalidation, processing-lease policy, public consumer API, callback, or async runtime."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/consumer/classic_group/heartbeat_state_test.rs::attempt_deadline_is_clamped_to_the_prior_confirmed_session_bound",
