[[invariant]]
id = "IDM-01"
title = "Idempotent producer state is fenced"
statement = "Core lazily acquires one nontransactional producer identity against the original operation deadline, assigns one partition-local contiguous sequence lease before wire materialization, advances it only after terminal success preflight, reuses it for definitely-unsent retries and after final-member pre-driver cancellation, and fences all accepted work atomically when identity or possibly-sent sequence certainty is lost. Engine uses the generated kafka-wire InitProducerId and record-batch types through tracked kafka-driver calls without an async runtime."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/idempotence_acquisition_test.rs::lazy_identity_uses_original_deadline_before_materialization",
  "crates/kafka-client-core/src/producer/idempotence_acquisition_test.rs::identity_failure_settles_waiting_and_open_batches_atomically",
  "crates/kafka-client-core/src/producer/idempotence_sequence_test.rs::successful_sequence_wraps_only_after_terminal_preflight",
  "crates/kafka-client-core/src/producer/idempotence_sequence_test.rs::broker_success_preflight_failure_does_not_advance_sequence",
