id = "CON-08"
title = "Classic Join and Sync are cycle- and assignment-fenced"
statement = "One uniquely owned deterministic classic-group machine admits at most one nonreused Join and Sync cycle at a time. It immutably retains independently validated session and rebalance timeout milliseconds in Kafka's exact positive signed 32-bit request domain and emits both unchanged with every Join; neither scalar is conflated with the separate application-processing lease. Engine registration passes that validated timing unchanged into the machine, while the separately supplied cycle Duration determines only one captured core and transport absolute deadline inside the private port before shard contention; the engine neither defaults nor reconstructs Kafka timing from that duration. The engine retains the exact core-emitted Join intent, including its timing, and treats a post-commit wake failure as advisory. Only locally prepared work may emit an exact due DeadlineElapsed fact: a linear handoff either restores the same Join owner after rejection or consumes a driver-acceptance receipt and transfers the exact group, cycle, protocol, timing, core deadline, and transport deadline into driver ownership while local expiry is disarmed. Driver-shutdown recovery requires the matching linear tracking owner and rejects a foreign identity without mutation. Separate bounded engine Join and Sync call owners fence raw tracked terminals by stable GroupId and MembershipCycle while retaining that original deadline as an exact correlation fact rather than duplicate identity. Each reserved identity is bound to one coordinator spelling that must exactly match the generated request group, so equal cycle numbers in different groups do not collide and one group cannot route another group's request. Successful tracked submission returns one linear accepted-call receipt carrying the exact key; settlement borrows it, exact confirmation consumes it beside the route token, and cross-group or changed-deadline mismatches cannot mutate the call registry and preserve receipt ownership. Exact selected versions, uninterpreted generated responses or driver failures, route tokens, and external accepted-call receipts remain recoverable through two-phase settlement, while post-driver recovery consumes the call registry before transferring its preallocated storage. Join success never activates an assignment: followers emit an empty Sync plan, while leaders require a bounded scalar, dynamic-member, non-rack-aware Range plan and may install only the exact local assignment computed by core. Dynamic Range Join uses one wire-owned v0 subscription across the exact v1-v3 outer API window; bounded successful leader responses become engine-owned member and topic facts, while signed broker errors remain exact. Successful leader interpretation stages that bounded candidate, applies core's exact JoinLeader input, and retains the resulting ordered RequestPartitionCounts facts in one non-clone owner carrying the same cycle and original deadline. Two-phase Join settlement confirms the driver route before exposing the prepared count read. The engine submits one core-requested topic at a time through the sole driver-owned TopicView adapter under the unchanged transport deadline; one linear call identity fences group, cycle, topic, and deadline while group composition sees only scalar metadata-generation and logical-count facts and imports no generated Metadata DTO or competing topology cache. Counts advance only in core-requested order, and a generation change discards any mixed partial set before restarting from the first topic. Only pre-admission SubmitError::Full restores the prepared owner as retryable backpressure; accepted capacity outcomes and every other non-corrupt terminal error settle the count stage exactly once, with exact-deadline DeadlineElapsed precedence, while corruption or a rejected deadline transition freezes the exact prepared and accepted call owners. An active pre-deadline empty topic union completes locally without a TopicView call, whereas Closing or exactly due work remains for local close or expiry. Only a complete non-mixed count set materializes the existing wire-delegating leader Sync request after core emits its exact Range plan, and post-driver recovery consumes the accepted call before applying the count-stage failure once. Sync correlates every core plan slot and topic identity before emitting wire-owned v0 assignments across the exact v0-v2 outer API window. Successful Sync normalization preserves valid wire order for later catalog canonicalization while rejecting negative partitions and duplicate topics or partitions. A pure catalog seam retains the exact normalized assignment on rejection, requires the candidate's unchanged catalog base, resolves only durable catalog topic spellings, rejects topics outside the candidate's local subscription, checks signed partition conversion, and canonicalizes the accepted result into ordered unique scalar core facts without catalog or core mutation. Only matching Sync success installs the exact live member, signed Kafka generation, ordered assignment, and nonreused core assignment generation. Explicit matching assignment loss revokes the prior assignment and Kafka-generation pair before another Join may begin. Shutdown closes and revokes only locally owned cycles; contention cannot look quiescent, driver-owned work remains unsettled, and any impossible revoke-preparation mismatch retains the exact assignment effect. Stale, cross-group, out-of-phase, stage-delayed, and failed cycle facts cannot mutate or install the live session."
