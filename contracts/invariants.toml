  "crates/kafka-client-engine/src/consumer/assigned_event/prepared_test.rs::rejected_and_rolled_back_preparations_preserve_existing_claims",
  "crates/kafka-client-engine/src/consumer/assigned_event/prepared_test.rs::prepared_replacement_rejects_impossible_terminal_and_hitchhiker_effects",
  "crates/kafka-client-engine/src/consumer/assigned_owner_event_test.rs::terminal_failure_effects_transfer_to_exact_fifo_events",
  "crates/kafka-client-engine/src/consumer/assigned_owner_event_test.rs::ready_events_do_not_block_close_but_claimed_slots_do",
