  "crates/kafka-client-core/src/producer/idempotence_fencing_test.rs::authoritative_success_after_another_batch_fences_still_delivers_once",
  "crates/kafka-client-core/src/producer/cancellation_revision_test.rs::sole_sealed_member_releases_sequence_lease_without_advancing",
  "crates/kafka-client-core/src/producer/retry_cancellation_test.rs::sole_retry_waiting_cancellation_releases_sequence_lease_without_advancing",
  "crates/kafka-client-engine/src/producer/identity_submission_test.rs::handoff_preserves_generation_and_original_operation_deadline",
  "crates/kafka-client-engine/src/driver/rpc/init_producer_id_submission_test.rs::options_preserve_original_deadline_control_lane_and_stable_v5_ceiling",
  "crates/kafka-client-engine/src/driver/rpc/init_producer_id_calls_test.rs::broker_failure_preserves_exact_signed_code",
