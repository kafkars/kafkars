  "crates/kafka-client-engine/src/producer/pending/recovery/queue_test.rs::terminal_tail_remains_fifo_when_the_normal_queue_is_full",
  "crates/kafka-client-engine/src/producer/pending/recovery/worker_test.rs::worker_dispatches_away_from_the_submitting_thread_and_joins",
  "crates/kafka-client-engine/src/producer/pending/recovery/route_test.rs::retain_stages_exact_fifo_without_running_application_wakers",
  "crates/kafka-client-engine/src/producer/pending/recovery/route_test.rs::retain_overflow_returns_the_exact_newer_job",
