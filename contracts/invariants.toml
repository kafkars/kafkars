id = "OBS-01"
title = "Observer drop is not network cancellation"
statement = "Dropping an observer leaves accepted work owing a terminal value; publication then drops that value and reclaims the slot exactly once."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/completion/registry_test.rs::pending_abandonment_settles_and_reclaims_exactly_once",
  "crates/kafka-client-engine/src/producer/reclaim_turn_test.rs::abandoned_observation_reclaims_after_terminal_publication",
  "crates/kafka-client-engine/src/delivery_observer_test.rs::dropping_delivery_observer_preserves_abandon_reclaim",
  "crates/kafka-client-engine/src/consumer/assigned_host/close_observer_test.rs::observer_drop_abandons_without_revoking_terminal_authority",
]

[[invariant]]
id = "OP-01"
title = "Accepted operations reserve one terminal outcome"
statement = "Engine completion and byte reservations commit atomically with core acceptance, and a terminal completion is single-assignment."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/admission_test.rs::non_ready_admission_synchronizes_core_store_timer_and_observer",
  "crates/kafka-client-engine/src/producer/execution_turn_test.rs::materialization_capacity_failure_is_a_core_owned_terminal_fact",
  "crates/kafka-client-core/src/completion_test.rs::terminal_completion_is_exactly_once",
]

[[invariant]]
id = "PRT-01"
title = "Keyed partitioning is Java-compatible"
statement = "Present serialized keys use Kafka's Java Murmur2 arithmetic, sign-bit masking, and modulo over a validated total logical partition count rather than the currently available subset; the generation-stamped result retains whether its selected logical partition has a known leader, and null keys remain outside keyed policy."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/partitioner_test.rs::apache_java_golden_vectors_select_the_same_partitions",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::negative_java_hash_uses_sign_bit_masking_instead_of_absolute_value",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::empty_present_key_is_hashed_and_single_partition_is_zero",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::partition_count_rejects_zero_and_values_outside_java_domain",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::serialized_key_length_rejects_values_outside_java_array_domain",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::keyed_selection_uses_logical_count_instead_of_available_count",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::keyed_selection_retains_available_leader_facts",
]

[[invariant]]
id = "PRT-02"
title = "Unkeyed selection is sticky and availability-aware"
statement = "Per-topic unkeyed selection captures one generation, logical count, and available length, lazily reads driver-owned entries without copying a topology cache, remains on one available partition until its batch seals, reselects when that partition becomes unavailable, and advances from target-independent caller dispersion."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/topic_partitions_test.rs::facts_borrow_a_lazy_source_without_copying_a_topic_cache",
  "crates/kafka-client-core/src/producer/topic_partitions_test.rs::missing_index_below_captured_source_length_is_rejected_at_use",
  "crates/kafka-client-core/src/producer/topic_partitions_test.rs::source_partitions_must_fit_the_total_logical_count",
  "crates/kafka-client-core/src/producer/topic_partition_test.rs::kafka_absent_leader_epoch_is_distinct_from_malformed_negative_values",
  "crates/kafka-client-core/src/producer/sticky_test.rs::repeated_unkeyed_selection_sticks_while_partition_remains_available",
  "crates/kafka-client-core/src/producer/sticky_test.rs::sealed_batches_advance_over_available_partitions_in_stable_order",
  "crates/kafka-client-core/src/producer/sticky_test.rs::metadata_loss_reselects_without_waiting_for_the_old_batch_to_seal",
  "crates/kafka-client-core/src/producer/sticky_test.rs::unavailable_topic_rejects_without_mutating_sticky_state",
  "crates/kafka-client-core/src/producer/sticky_test.rs::available_selection_uses_the_exact_indexed_fact_without_a_second_lookup",
]

[[invariant]]
id = "RCT-01"
title = "Application code never runs on a reactor"
statement = "Driver and engine reactors publish into bounded completion mechanisms and never invoke Rust or foreign application callbacks."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/completion/settlement_test.rs::hostile_waker_runs_only_on_the_completion_notifier",
  "crates/kafka-client-engine/src/engine_test.rs::notifier_reentrant_shutdown_returns_without_blocking_host_cleanup",
  "crates/kafka-client-engine/src/producer/compression/pool_test.rs::worker_materializes_and_wakes_away_from_the_host_thread",
]

[[invariant]]
id = "RTY-01"
title = "Producer retries require definitely-unsent structural evidence"
statement = "Only a normalized structurally transient attempt with authoritative NotSent certainty may start a bounded replacement execution after nonzero backoff; PossiblySent and broker terminal facts never retry, and every replacement retains the original deadline, bytes, completion, flush, and close ownership."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/retry_test.rs::definitely_unsent_transient_failure_retries_with_a_fresh_execution",
  "crates/kafka-client-core/src/producer/retry_test.rs::retry_bound_exhaustion_settles_without_reusing_an_execution",
  "crates/kafka-client-core/src/producer/retry_safety_test.rs::possibly_sent_permanent_and_broker_failures_never_retry",
  "crates/kafka-client-core/src/producer/retry_safety_test.rs::original_deadline_caps_backoff_and_settles_before_another_attempt",
  "crates/kafka-client-core/src/producer/retry_safety_test.rs::flush_waits_across_retry_and_completes_after_record_terminal",
  "crates/kafka-client-core/src/producer/retry_safety_test.rs::close_waits_across_retry_and_completes_after_record_terminal",
  "crates/kafka-client-engine/src/driver/delivery_test.rs::only_recoverable_connection_shapes_are_transient",
  "crates/kafka-client-engine/src/driver/delivery_test.rs::driver_owned_possibly_sent_evidence_is_preserved",
  "crates/kafka-client-engine/src/producer/host/driver_input_test.rs::live_retry_rematerializes_fresh_execution_with_original_deadline",
  "crates/kafka-client-engine/src/producer/host/driver_input_test.rs::live_possibly_sent_failure_never_creates_replacement",
  "crates/kafka-client-sim/src/state/retry_test.rs::retry_retains_attempt_history_and_materializes_only_the_replacement",
]

[[invariant]]
id = "SD-01"
title = "Shutdown closes admission before draining"
statement = "Shutdown closes producer admission before draining. Emergency recovery attempts the shared driver barrier, unconditionally drops the unique driver and every tracked Produce owner, then releases engine bytes and publishes conservative core fallback. Native compression workers and the Drop-backed notifier owner are joined during finalization before one shared report is retained."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/execution_stop_test.rs::damaged_interpretation_still_settles_observers_conservatively",
  "crates/kafka-client-engine/src/producer/execution_stop_test.rs::planning_failure_replaces_the_live_core_before_fallback_publication",
  "crates/kafka-client-engine/src/engine_test.rs::concurrent_shutdown_callers_observe_one_retained_report",
  "crates/kafka-client-engine/src/engine_test.rs::final_engine_drop_on_notifier_still_reaches_closed",
  "crates/kafka-client-engine/src/engine_host/recovery_test.rs::damaged_interpretation_releases_driver_and_bytes_before_retained_failure_report",
  "crates/kafka-client-engine/src/engine_host/recovery_test.rs::failed_runner_settles_accepted_work_and_closes_retained_handles",
  "crates/kafka-client-engine/src/engine_host/start_test.rs::notifier_join_failure_appends_without_replacing_primary_failure",
  "crates/kafka-client-engine/src/engine_host/start_test.rs::finalizer_panic_still_publishes_a_terminal_report",
  "crates/kafka-client-engine/src/driver/owner_test.rs::retained_explicit_shutdown_barrier_settles_with_the_reactor",
  "crates/kafka-client-engine/src/producer/compression/pool_test.rs::shutdown_joins_every_owned_native_worker",
]

[[invariant]]
id = "TMR-01"
title = "Batch timers are generation-fenced"
statement = "A newer batch-timer generation replaces older schedules, and stale cancellation or firing cannot affect the live generation."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/clock/timer_test.rs::newer_generation_replaces_older_schedule_once",
  "crates/kafka-client-engine/src/clock/timer_test.rs::stale_cancellation_does_not_remove_replacement",
  "crates/kafka-client-core/src/producer_timer_test.rs::earlier_deadline_rearms_timer_and_stale_facts_are_harmless",
  "crates/kafka-client-core/src/producer/retry_cancellation_test.rs::shared_retry_cancellation_revises_survivors_and_replaces_timer",
]

[[invariant]]
id = "TXN-01"
title = "Transactions are uniquely owned and epoch-fenced"
statement = "One transactional producer has at most one active transaction, with distinct abort-required and fatal fenced outcomes."
status = "planned"
milestone = "transactional-producer"
