schema = 1

[[invariant]]
id = "BAT-01"
title = "Core owns batch readiness"
statement = "Record-count and conservative encoded-size readiness are deterministic core decisions and terminal fan-out preserves batch membership order."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer_transition_test.rs::count_ready_batch_fans_success_out_in_membership_order",
  "crates/kafka-client-core/src/producer_transition_test.rs::conservative_accumulator_size_threshold_is_core_owned",
]

[[invariant]]
id = "BND-01"
title = "Retained producer bytes are bounded"
statement = "Application records and encoded batches have explicit count and byte limits; admission preserves provenance and releases each reservation exactly once."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/record_store_test.rs::count_and_bytes_are_reserved_before_core_admission",
  "crates/kafka-client-engine/src/producer/record_store_test.rs::release_checks_provenance_and_happens_exactly_once",
  "crates/kafka-client-engine/src/producer/execution_test.rs::encoded_capacity_failure_becomes_a_core_owned_not_sent_outcome",
  "crates/kafka-client-engine/src/producer/execution/materialization_test.rs::prepared_entry_count_bound_rejects_without_accounting_drift",
]

[[invariant]]
id = "CAN-01"
title = "Cancellation is stage-aware"
statement = "Cancellation reports whether transport ownership makes a NotSent outcome impossible and never treats observer abandonment as cancellation."
status = "planned"
milestone = "generation-fenced-sealed-batch-cancellation"

[[invariant]]
id = "CLS-01"
title = "Producer close is an atomic first-success fence"
statement = "Engine producer close reserves shared terminal capacity before core acceptance. The first accepted close atomically fences clone-shared record, flush, and close admission while its drain barrier follows the existing flush terminal FIFO and reclamation path. Pre-acceptance rejection leaves admission open."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/close_transition_test.rs::close_atomically_captures_drain_barrier_before_rejecting_new_records",
  "crates/kafka-client-core/src/producer/close_transition_test.rs::close_capacity_failure_leaves_record_admission_open",
  "crates/kafka-client-engine/src/producer/boundary/handle_test.rs::close_is_clone_shared_and_first_success_wins",
  "crates/kafka-client-engine/src/producer/ingress/close_test.rs::wake_failure_keeps_the_clone_shared_close_fence",
  "crates/kafka-client-engine/src/producer/ingress/data_test.rs::accepted_close_invariant_still_fences_shared_admission",
  "crates/kafka-client-engine/src/producer/ingress/data_test.rs::producer_close_fences_records_flushes_and_repeated_close",
  "crates/kafka-client-engine/src/producer/ingress/data_test.rs::close_capacity_failure_leaves_record_and_flush_admission_running",
  "crates/kafka-client-engine/src/producer/terminal_publication_test.rs::close_publication_stays_behind_prior_record_under_notifier_backpressure",
  "crates/kafka-client-engine/src/producer/flush/close_reclaim_test.rs::abandoned_close_reclaims_its_exact_flush_binding_and_shared_capacity",
  "crates/kafka-client/src/producer/close_test.rs::public_close_is_clone_shared_and_first_success_wins",
]

[[invariant]]
id = "CMP-01"
title = "Completion capacity survives until core-confirmed reclamation"
statement = "An unobserved terminal retains its bounded slot, and slot reuse follows one exact core reclamation handshake."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/completion/registry_test.rs::unobserved_terminal_retains_fixed_capacity",
  "crates/kafka-client-engine/src/producer/reclaim_test.rs::core_confirmation_precedes_exact_binding_and_capacity_release",
  "crates/kafka-client-engine/src/producer/reclaim_test.rs::registry_retry_never_emits_a_second_core_input",
  "crates/kafka-client-engine/src/producer/reclaim_turn_test.rs::observed_completion_reuses_only_a_new_completion_generation",
  "crates/kafka-client-engine/src/producer/reclaim_turn_test.rs::locked_cell_retry_does_not_repeat_the_core_reclaim_input",
  "crates/kafka-client-engine/src/delivery_observer_test.rs::wait_and_future_observe_the_same_terminal_cell",
]

[[invariant]]
id = "CON-01"
title = "Consumer checkpoints are assignment-fenced next offsets"
statement = "A checkpoint records the next offset and cannot commit or deliver after its assignment epoch is superseded."
status = "planned"
milestone = "direct-and-group-consumer"

[[invariant]]
id = "DL-01"
title = "Producer policy consumes one absolute deadline"
statement = "Engine deadline capture derives core and transport absolutes from one monotonic instant, accepted operation bindings retain that pair unchanged, core rejects already elapsed work, and queued submission expiry reproduces the exact core deadline fact."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/clock/monotonic_test.rs::deadline_capture_uses_one_boundary_observation",
  "crates/kafka-client-engine/src/producer/execution/submission_test.rs::submission_requires_and_preserves_the_admitted_operation_deadline",
  "crates/kafka-client-engine/src/producer/execution/handoff_test.rs::handoff_preserves_exact_execution_deadline_and_encoded_owner",
  "crates/kafka-client-engine/src/producer/execution/handoff_test.rs::accounting_corruption_preserves_the_full_prepared_entry",
  "crates/kafka-client-engine/src/producer/execution/handoff_test.rs::missing_schedule_preserves_the_full_prepared_entry",
  "crates/kafka-client-core/src/producer_test.rs::elapsed_deadline_never_crosses_admission",
  "crates/kafka-client-engine/src/producer/execution/deadline_test.rs::due_entries_emit_exact_facts_in_deadline_then_batch_order",
  "crates/kafka-client-engine/src/producer/execution_test.rs::pre_driver_expiry_releases_encoded_and_original_bytes_as_not_sent",
  "crates/kafka-client-engine/src/producer/execution_turn_test.rs::pre_driver_expiry_releases_both_byte_owners_and_publishes_not_sent",
  "crates/kafka-client-engine/src/producer/execution_turn_test.rs::terminal_release_cancels_submission_that_never_started",
]

[[invariant]]
id = "DLV-01"
title = "Delivery certainty cannot improve"
statement = "PossiblySent is invalid before driver ownership, driver acceptance invents no certainty, the engine protocol boundary normalizes broker codes and rejects uncorrelatable response shapes as PossiblySent, and core policy preserves the exact signed code and reported certainty."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/operation_test.rs::possibly_sent_is_invalid_before_driver_ownership",
  "crates/kafka-client-core/src/operation_test.rs::driver_acceptance_does_not_invent_delivery_certainty",
  "crates/kafka-client-engine/src/protocol/produce_failure_test.rs::every_owned_produce_error_code_maps_to_its_semantic_category",
  "crates/kafka-client-engine/src/protocol/produce_failure_test.rs::unknown_signed_code_remains_lossless",
  "crates/kafka-client-engine/src/protocol/produce_response_test.rs::broker_failure_response_is_possibly_sent_and_preserves_normalized_code",
  "crates/kafka-client-engine/src/protocol/produce_response_test.rs::structural_response_failures_are_possibly_sent",
  "crates/kafka-client-core/src/producer_transition_test.rs::broker_failure_preserves_semantic_code_and_certainty",
  "crates/kafka-client-engine/src/delivery_test.rs::failure_certainty_preserves_not_sent_and_possibly_sent",
]

[[invariant]]
id = "DRV-01"
title = "Driver handoff preserves deadline and certainty"
statement = "The public facade captures an absolute deadline before waiting, the engine submits it through the reactor-native driver seam, and delivery classification returns without a second retry authority."
status = "planned"
milestone = "native-produce-driver-handoff"

[[invariant]]
id = "EXE-01"
title = "Permanent execution loss settles accepted work"
statement = "Permanent execution loss closes admission and settles every accepted producer operation once, releasing timers and retained resources before bounded terminal publication with conservative delivery certainty."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/execution_stop_test.rs::execution_loss_settles_every_batch_stage_in_release_before_complete_order",
  "crates/kafka-client-core/src/producer/execution_stop_test.rs::empty_execution_loss_is_idempotent_and_closes_admission",
  "crates/kafka-client-core/src/producer/execution_stop_test.rs::execution_loss_does_not_repeat_an_unreclaimed_terminal",
  "crates/kafka-client-core/src/producer/execution_stop_capacity_test.rs::execution_loss_uses_the_combined_record_and_flush_bound",
]

[[invariant]]
id = "FL-01"
title = "Flush is an admission-sequence barrier"
statement = "Flush captures the next admission sequence, contains exactly operations with earlier sequences, excludes later admissions, and emits its terminal-decision effect after every included operation's ordered terminal-decision effect."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/flush_transition_test.rs::flush_includes_exactly_operations_accepted_before_its_barrier",
  "crates/kafka-client-core/src/producer/flush_transition_test.rs::overlapping_flushes_settle_in_barrier_order",
  "crates/kafka-client-core/src/producer/flush_transition_test.rs::terminal_decision_orders_flush_after_record_completion_effect",
]

[[invariant]]
id = "FL-02"
title = "Flush observability follows record publication"
statement = "A flush becomes observable only after every included record terminal is actually published or retained in a retry-acknowledged completion path."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/terminal_publication_test.rs::flush_publication_stays_behind_retained_record_terminal_under_notifier_backpressure",
]

[[invariant]]
id = "GEN-01"
title = "Sealed batch executions are generation-fenced"
statement = "The first immutable sealed-batch membership snapshot has a nonzero execution identity propagated exactly through core, materialization, prepared-byte, deadline, and simulator ownership; stale local outcomes are harmless, stale driver acceptance facts are fatal, and exact-generation facts in the wrong lifecycle phase remain invalid."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/input_outcome_test.rs::generation_fenced_inputs_distinguish_stale_facts_from_corruption",
  "crates/kafka-client-core/src/producer/input_outcome_test.rs::sealed_generation_is_nonzero_initial_identity",
  "crates/kafka-client-engine/src/producer/batch_store/execution_test.rs::sealed_batch_execution_rejects_stale_phase_changes",
  "crates/kafka-client-engine/src/producer/batch_store/execution_test.rs::aborted_materialization_keeps_sealed_membership_closed",
  "crates/kafka-client-engine/src/producer/batch_store/execution_test.rs::stale_abort_does_not_revoke_replacement_execution",
  "crates/kafka-client-engine/src/producer/execution/materialization_test.rs::stale_commit_drops_the_exact_prepared_bytes_it_inserted",
  "crates/kafka-client-engine/src/producer/execution/deadline_test.rs::stale_generation_cannot_arm_or_take_the_current_entry",
  "crates/kafka-client-engine/src/producer/execution/handoff_test.rs::stale_execution_rejection_preserves_the_current_entry",
  "crates/kafka-client-engine/src/producer/execution/cleanup_test.rs::cleanup_preflight_preserves_wrong_generation_until_outside_in_recovery",
  "crates/kafka-client-sim/src/state/batch_test.rs::simulator_submits_only_exact_materialized_membership_snapshot",
]

[[invariant]]
id = "GEN-02"
title = "Replacement batch executions never reuse identity"
statement = "Future replacement or revision of sealed batch membership advances without identity reuse, defines exhaustion behavior, and carries the exact execution through the real kafka-driver handoff and acceptance receipt."
status = "planned"
milestone = "generation-fenced-driver-handoff"

[[invariant]]
id = "IDM-01"
title = "Idempotent producer state is fenced"
statement = "Producer identity epochs and per-partition sequence ranges are monotonic, uniquely owned, and recover only according to core policy."
status = "planned"
milestone = "idempotent-producer"

[[invariant]]
id = "MAT-01"
title = "Materialization retains canonical records without changing semantics"
statement = "Materialization preserves record order and nullable fields, creates a separately bounded encoded representation from shared canonical record handles, and retains canonical accounting until ordered core release effects execute."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/materialization_test.rs::ordered_records_null_empty_and_duplicate_headers_survive_transfer",
  "crates/kafka-client-engine/src/producer/materialization_test.rs::encoding_failure_keeps_accounting_until_ordered_release_effects",
  "crates/kafka-client-engine/src/producer/materialization_retention_test.rs::materialization_view_keeps_canonical_record_owned_until_terminal_release",
  "crates/kafka-client-engine/src/producer/execution/materialization_test.rs::semantic_encoding_failure_returns_exact_attempt_to_ready",
  "crates/kafka-client-engine/src/producer/execution/materialization_test.rs::prepared_capacity_failure_returns_exact_attempt_to_ready",
  "crates/kafka-client-engine/src/producer/execution_test.rs::materialization_retains_one_bounded_request_without_fake_driver_acceptance",
  "crates/kafka-client-engine/src/producer/execution_turn_test.rs::immediate_batch_materializes_then_waits_without_fake_acceptance",
  "crates/kafka-client-engine/src/producer/execution_turn_test.rs::semantic_partition_encoding_failure_settles_without_poisoning_host",
]

[[invariant]]
id = "META-01"
title = "The driver is sole cluster-topology authority"
statement = "Metadata generations and exact route receipts fence stale leader knowledge without a second client-owned topology cache."
status = "planned"
milestone = "metadata-driven-partitioning"

[[invariant]]
id = "OBS-01"
title = "Observer drop is not network cancellation"
statement = "Dropping an observer leaves accepted work owing a terminal value; publication then drops that value and reclaims the slot exactly once."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/completion/registry_test.rs::pending_abandonment_settles_and_reclaims_exactly_once",
  "crates/kafka-client-engine/src/producer/reclaim_turn_test.rs::abandoned_observation_reclaims_after_terminal_publication",
  "crates/kafka-client-engine/src/delivery_observer_test.rs::dropping_delivery_observer_preserves_abandon_reclaim",
]

[[invariant]]
id = "OP-01"
title = "Accepted operations reserve one terminal outcome"
statement = "Engine completion and byte reservations commit atomically with core acceptance, and a terminal completion is single-assignment."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/admission_test.rs::non_ready_admission_synchronizes_core_store_timer_and_observer",
  "crates/kafka-client-engine/src/producer/execution_turn_test.rs::materialization_capacity_failure_is_a_core_owned_terminal_fact",
  "crates/kafka-client-core/src/completion_test.rs::terminal_completion_is_exactly_once",
]

[[invariant]]
id = "PRT-01"
title = "Keyed partitioning is Java-compatible"
statement = "Present serialized keys use Kafka's Java Murmur2 arithmetic, sign-bit masking, and modulo over a validated total logical partition count; null keys remain outside keyed policy."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/producer/partitioner_test.rs::apache_java_golden_vectors_select_the_same_partitions",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::negative_java_hash_uses_sign_bit_masking_instead_of_absolute_value",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::empty_present_key_is_hashed_and_single_partition_is_zero",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::partition_count_rejects_zero_and_values_outside_java_domain",
  "crates/kafka-client-core/src/producer/partitioner_test.rs::serialized_key_length_rejects_values_outside_java_array_domain",
]

[[invariant]]
id = "RCT-01"
title = "Application code never runs on a reactor"
statement = "Driver and engine reactors publish into bounded completion mechanisms and never invoke Rust or foreign application callbacks."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/completion/settlement_test.rs::hostile_waker_runs_only_on_the_completion_notifier",
  "crates/kafka-client-engine/src/engine_test.rs::notifier_reentrant_shutdown_returns_without_blocking_host_cleanup",
]

[[invariant]]
id = "SD-01"
title = "Shutdown closes admission before draining"
statement = "Shutdown closes producer admission before draining, drops engine-owned bytes and mechanisms before emergency fallback is observable, and replaces terminal core state before retaining one shared report. A Drop-backed notifier owner joins off-reactor during normal finalization and finalizer unwind before that report is published. Driver-owned Produce bytes become a ratchet trigger when that path is integrated."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/execution_stop_test.rs::damaged_interpretation_still_settles_observers_conservatively",
  "crates/kafka-client-engine/src/producer/execution_stop_test.rs::planning_failure_replaces_the_live_core_before_fallback_publication",
  "crates/kafka-client-engine/src/engine_test.rs::concurrent_shutdown_callers_observe_one_retained_report",
  "crates/kafka-client-engine/src/engine_test.rs::final_engine_drop_on_notifier_still_reaches_closed",
  "crates/kafka-client-engine/src/engine_host/recovery_test.rs::damaged_interpretation_drains_resources_before_retained_failure_report",
  "crates/kafka-client-engine/src/engine_host/recovery_test.rs::failed_runner_settles_accepted_work_and_closes_retained_handles",
  "crates/kafka-client-engine/src/engine_host/start_test.rs::notifier_join_failure_appends_without_replacing_primary_failure",
  "crates/kafka-client-engine/src/engine_host/start_test.rs::finalizer_panic_still_publishes_a_terminal_report",
  "crates/kafka-client-engine/src/driver/owner_test.rs::dropping_the_sole_driver_handle_uses_implicit_reactor_shutdown",
]

[[invariant]]
id = "TMR-01"
title = "Batch timers are generation-fenced"
statement = "A newer batch-timer generation replaces older schedules, and stale cancellation or firing cannot affect the live generation."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/clock/timer_test.rs::newer_generation_replaces_older_schedule_once",
  "crates/kafka-client-engine/src/clock/timer_test.rs::stale_cancellation_does_not_remove_replacement",
  "crates/kafka-client-core/src/producer_timer_test.rs::earlier_deadline_rearms_timer_and_stale_facts_are_harmless",
]

[[invariant]]
id = "TXN-01"
title = "Transactions are uniquely owned and epoch-fenced"
statement = "One transactional producer has at most one active transaction, with distinct abort-required and fatal fenced outcomes."
status = "planned"
milestone = "transactional-producer"
