[[invariant]]
id = "CON-04"
title = "Direct Fetch execution is ordered and bounded"
statement = "One unique direct-consumer Fetch executor accepts only a linear internal-attempt deadline bound to the exact prepared fence, reconciles that fence against core ownership, and checks its original absolute deadline before reserving retained-output count and bytes, then attempts bounded tracked-call admission without inventing retry policy. Backpressure returns the exact prepared owner and releases its exact reservation; superseded queued work settles without spending store or driver capacity, while future or cross-partition ownership becomes a frozen invariant fault. Terminal handling normalizes through the protocol reservation, applies the exact fact to core, authorizes or discards store ownership according to core's ordered effects, and only then confirms the exact route capability. Stale terminals cannot publish delivery, and every store, core, completion, or confirmation inconsistency freezes all executor surfaces while retaining linear owners until post-driver-shutdown recovery. The concrete AssignedConsumerOwner exclusively constructs the core, topic, timer, position, Fetch, and close owners around one Arc monotonic clock; derives a checked 2P+1 FIFO bound from replacement and close effect maxima; fallibly preallocates raw, position, Fetch, and reclaim storage; and borrows DriverOwner only during one bounded turn. Position and Fetch each own an independent call_capacity bound, so the aggregate retains at most 2 * call_capacity accepted driver calls. It interprets one FIFO head without overtaking, leaves Fetch ControlPending unchanged without false progress, captures each Fetch deadline at exact effect interpretation, expires prepared position work before driver capacity, recaptures Moment at each later stage, retains every faulted linear owner, and schedules the minimum retained deadline only while healthy. Delivery exposure waits behind ordered effects and open close admission, asks core whether assignment and position still own the authorized delivery while ignoring its settled Fetch revision, reclaims every stale FIFO entry until active or empty, and retains external leases through close. The embedded host owns one concrete shard and drives at most one owner turn per host stage. Its private non-clone port captures public-operation deadlines before closed or contended admission checks, commits through the synchronized owner slot, and treats a failed post-commit reactor wake as advisory. Host contention reports blocked work without false progress or spinning, and the owner's earliest absolute deadline participates in the shared park decision."
