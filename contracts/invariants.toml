[[invariant]]
id = "ADM-01"
title = "CreateTopics preserves one ordered terminal decision"
statement = "One capacity-reserved CreateTopics machine assigns at most one terminal decision, validates normalized results against original request order, and the generated protocol seam preserves exact unknown broker codes while restoring broker results to that order."
status = "enforced"
evidence = [
  "crates/kafka-client-core/src/admin/transition_test.rs::mixed_broker_results_are_terminal_once_in_request_order",
  "crates/kafka-client-core/src/admin/transition_test.rs::malformed_normalized_order_does_not_consume_terminal_assignment",
  "crates/kafka-client-engine/src/protocol/admin/create_topics_test.rs::response_is_reordered_to_request_order_and_unknown_code_is_lossless",
  "crates/kafka-client-engine/src/protocol/admin/create_topics_test.rs::structural_mismatches_never_bind_results_to_the_wrong_topic",
]

[[invariant]]
id = "ADM-02"
title = "CreateTopics execution is bounded and driver tracked"
statement = "Engine CreateTopics admission atomically reserves terminal and canonical retained-byte capacity, carries one original absolute deadline into a tracked controller request, preserves exact bounded ordered results, treats a taken submission as possibly driver-owned during recovery, retains bytes until observer reclamation, and joins every notifier during shutdown."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/admin/host_test.rs::terminal_bytes_remain_reserved_until_observer_reclamation",
  "crates/kafka-client-engine/src/admin/host_test.rs::pre_driver_wait_expires_without_transport_ownership",
  "crates/kafka-client-engine/src/admin/host_test.rs::recovery_after_submission_handoff_is_conservatively_possibly_sent",
  "crates/kafka-client-engine/src/admin/host_test.rs::recovery_of_untouched_queued_submission_remains_not_sent",
  "crates/kafka-client-engine/src/admin/model_test.rs::excess_input_capacity_is_removed_before_retained_byte_charging",
  "crates/kafka-client-engine/src/driver/rpc/create_topics_submission_test.rs::create_topics_uses_interactive_lane_original_deadline_and_v7_ceiling",
  "crates/kafka-client-engine/src/driver/rpc/create_topics_calls_test.rs::settled_input_moves_once_while_route_authority_remains_owned",
  "crates/kafka-client-engine/src/protocol/admin/result_budget_test.rs::diagnostic_cap_truncates_on_a_utf8_boundary_and_preserves_exact_code",
  "crates/kafka-client-engine/src/engine_host/notifier_shutdown_test.rs::partial_notifier_acquisition_joins_the_owner_already_taken",
]

[[invariant]]
id = "ADM-03"
title = "Rust CreateTopics submission is explicit and lossless"
statement = "The Rust facade prepares an inert batch before one explicit submit boundary, returns immediate definitely-unsent rejection through the same named runtime-neutral observer used by Future and blocking wait, and exhaustively preserves ordered outcomes, signed broker codes, bounded-diagnostic truncation, and delivery certainty without an async runtime or hidden retry."
status = "enforced"
evidence = [
  "crates/kafka-client/src/admin/batch_result_test.rs::entries_preserve_request_order_and_move_without_reclassification",
  "crates/kafka-client/src/admin/builder_test.rs::empty_zero_deadline_builder_is_inert_until_submit",
  "crates/kafka-client/src/bridge/admin_test.rs::prepared_empty_request_is_rejected_without_first_poll_work",
  "crates/kafka-client/src/bridge/admin_operation_test.rs::wait_and_future_share_the_same_concrete_result_shape",
  "crates/kafka-client/src/bridge/admin_result_test.rs::every_admission_category_maps_without_hidden_retry_policy",
  "crates/kafka-client/src/bridge/admin_result_test.rs::whole_failure_preserves_authoritative_delivery_certainty",
  "crates/kafka-client/src/bridge/admin_result_test.rs::unknown_signed_code_and_bounded_diagnostic_are_lossless",
  "crates/kafka-client/src/bridge/admin_result_test.rs::observer_and_accepted_fault_categories_remain_distinct",
]

