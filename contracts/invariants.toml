[[invariant]]
id = "CON-05"
title = "Direct-consumer close is one-way, fenced, and core-completed"
statement = "After engine terminal-capacity reservation, the first BeginClose allocates one core-owned close identity and emits AcceptClose before permanently closing assignment and control admission. It preflights every assigned partition fence, then emits one final Suspend followed by Revoke in original assignment order without Fetch work. An unassigned close succeeds without inventing assignment identity and blocks every future assignment. AssignedConsumerOwner reserves its fixed slot before core admission and rolls reservation back on rejection, applies ordered cleanup through Fetch first, reclaims unread ready deliveries, waits for every external delivery lease and accepted call, timer, prepared owner, effect, and retained byte to drain, then supplies the exact accepted identity. Core alone emits CompleteClose exactly once, while early, mismatched, repeated-drain, and repeated-begin inputs cannot select another terminal outcome. Embedded-host shutdown closes private-port admission under the same owner lock, begins close once, and waits for the core-authorized ready terminal without reclaiming it. Normal owner-capability drop leaves that terminal for the unique port; abnormal recovery may consume the optional owner and release retained position, Fetch, delivery, and fault ownership only after driver teardown, after which surviving ports report OwnerMissing."
