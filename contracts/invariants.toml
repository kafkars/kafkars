[[invariant]]
id = "OWN-01"
title = "Pending promotion has one coordinated owner"
statement = "Removing a pending admission, claiming its observer cell, and transferring its exact record move through one non-cloneable attempt; every fallible restoration, settlement, or post-claim removal path returns the complete recovery owner. One dormant shard settlement consumes exactly one normal promotion outcome, distinguishes restored blocking from productive progress, releases unadmitted bytes before bounded notification retention, and preserves accepted delivery ownership. A separate dormant local turn expires running work or drains an explicitly closed shard under a nonzero caller limit. It routes completed jobs in order, preserves a refused current job, untouched suffix, retained prefix, and source-turn owner without allocating a replacement vector, and permits Closed to become Faulted only for drain-generated failure. The dormant composite turn orders local settlement before accepted work and at most one eligible promotion, and always retries the primary route afterward. Current single-lock execution can return only Host: a pending first fault installs its owner and returns Ok(Faulted), while an existing fault gates later local and promotion errors. Pending and HostAndPending are lossless structural future terminal-owner representations; their manually assembled executable evidence proves exact-owner representation only, not reachable composite execution. Explicit closure reports idle to promotion without consuming retained pending ownership, while an existing fault reports typed zero-work progress without replacing its exact first owner. Invariants close both admissions only after routing succeeds; route refusal retains the exact job with semantic context in the immutable first-fault slot, and later fatal owners return intact."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/pending/attempt_test.rs::accept_before_record_commit_returns_observer_attempt_and_exact_record",
  "crates/kafka-client-engine/src/producer/pending/attempt_transfer_test.rs::detached_record_restores_to_the_same_attempt_before_local_settlement",
