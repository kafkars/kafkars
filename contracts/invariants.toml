[[invariant]]
id = "CON-06"
title = "Direct-consumer terminal events are claimed, bounded, and retained"
statement = "The private AssignedConsumerEventStore has one fixed capacity shared by outstanding claims and ready FIFO events. Assignment replacement, resume, and seek reserve the exact event claims their core transitions may owe before applying those transitions, and core rejection rolls the prepared claims back without changing retained state. Only an exact PositionResolutionFailed, FetchThrottleFailed, or FetchFailed effect may consume its matching fence claim and retain one scalar-plus-Arc terminal event; stale terminal fences cannot steal newer claims, and exact revoke removes only claims owned by that assignment. Ready events remain charged until private-port observation, so capacity exhaustion backpressures new claim-bearing admission rather than dropping a terminal. Outstanding claims delay close, while already-ready terminals remain retained without preventing core-authorized close. Taking one linear event releases its slot without requesting a reactor wake because observation makes no host work runnable; later claim-bearing admission supplies its own wake. Abnormal recovery reports and releases exact claimed and ready counts after driver teardown. No record bytes, generated protocol type, driver capability, callback, async runtime, public observer, or facade connection enters this slice."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/consumer/assigned_event_test.rs::terminal_effects_transfer_exact_claims_into_fifo_events",
