[[invariant]]
id = "BND-02"
title = "Pending notification obligations are bounded"
statement = "The engine-internal pending-send seam reserves one non-cloneable notification permit at registration, and the live host prestarts one bounded off-reactor recovery worker. Constant-time route retention preserves exact FIFO ownership, primary retries require an explicit nonzero work limit, and a closed primary transfers the untouched head and tail irreversibly to recovery. Dormant expiry and shutdown drain use caller-bounded turns and retain every completed notification through that route. One dormant composite shard turn always gives the bounded route its retry opportunity after local, accepted, and promotion stages; Recovery mode requires terminal handoff rather than ordinary polling. Terminal recovery cannot run until the older primary notifier is joined, and dropping its paired stop owner drains and joins rather than detaching. Public waiting admission and the live composite host runner remain separate milestones."
status = "enforced"
evidence = [
  "crates/kafka-client-engine/src/producer/pending/permit_test.rs::notification_permit_is_not_reused_before_dispatch",
  "crates/kafka-client-engine/src/producer/pending/permit_test.rs::blocked_notifier_cannot_exceed_pending_notification_bound",
