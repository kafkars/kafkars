[[invariant]]
id = "TXN-01"
title = "Transactions are uniquely owned and epoch-fenced"
statement = "One uniquely owned transactional producer begins at most one active nonreused transaction epoch locally. Before Commit or Abort mutates that lifecycle, the engine reserves one terminal-completion owner and retains the exact mode, epoch, operation identity, and original absolute deadline. Each record send reserves terminal and lifecycle capacity before admission, returns the exact record on rejection, and fences end admission until exact terminal settlement. Per-partition producer sequences persist across successful transaction epochs, reuse a definitely-unsent sequence, and fence on uncertain or fatal outcomes. A send acquires its sequence only after fixing one exact partition: an explicit partition bypasses lookup, while an automatic send performs at most one deadline-bound topic-view lookup and applies keyed Java Murmur2 or bounded per-topic sticky selection. Partition enrollment and Produce retain exact epoch, send, route, bytes, sequence, and delivery evidence; definitely-unsent failures preserve a healthy transaction, append uncertainty requires abort, and fencing or lost correlation is fatal. One generated EndTxn v3 request uses kafka-driver's transaction-coordinator route and Interactive traffic under its unchanged deadline. A failed exact coordinator route token must be causally invalidated before settlement; only exact refreshed codes 14 through 16 may retry the same mode, epoch, operation, and deadline, and refresh itself expires at that deadline. Success returns the owner to Idle, while an ambiguous, incompatible, uncorrelatable, nonretryable, or exhausted end fences it Fatal. Dropping the active token schedules one unobserved best-effort Abort under the configured broker transaction timeout and can never synthesize success; dropping an accepted send or end observer abandons observation without cancelling the owed terminal. The curated Rust facade captures the send deadline before record translation, exposes one runtime-neutral named Future and blocking wait, and adds no callback, async runtime, or hidden retry. Assignment-fenced checkpoint transfer extends this same unique lifecycle only through TXN-02."
