services:
  kafka-1:
    volumes:
      - ${KAFKA_SASL_DIR:?set KAFKA_SASL_DIR}:/etc/kafka/secrets:ro
    environment: &sasl-environment
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/broker_jaas.conf

  kafka-2:
    volumes:
      - ${KAFKA_SASL_DIR:?set KAFKA_SASL_DIR}:/etc/kafka/secrets:ro
    environment: *sasl-environment

  kafka-3:
    volumes:
      - ${KAFKA_SASL_DIR:?set KAFKA_SASL_DIR}:/etc/kafka/secrets:ro
    environment: *sasl-environment
