services:
  kafka-1:
    image: ${IMAGE:?set IMAGE to an exact Kafka image digest}
    hostname: kafka-1
    ports:
      - "127.0.0.1:${KAFKA_BROKER_1_PORT:-29092}:9092"
    environment:
      <<: &common-environment
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:${KAFKA_EXTERNAL_PROTOCOL:-PLAINTEXT}
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
        KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
        KAFKA_DEFAULT_REPLICATION_FACTOR: 3
        KAFKA_MIN_INSYNC_REPLICAS: 2
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
        KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:${KAFKA_BROKER_1_PORT:-29092}

  kafka-2:
    image: ${IMAGE:?set IMAGE to an exact Kafka image digest}
    hostname: kafka-2
    ports:
      - "127.0.0.1:${KAFKA_BROKER_2_PORT:-39092}:9092"
    environment:
      <<: *common-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:${KAFKA_BROKER_2_PORT:-39092}

  kafka-3:
    image: ${IMAGE:?set IMAGE to an exact Kafka image digest}
    hostname: kafka-3
    ports:
      - "127.0.0.1:${KAFKA_BROKER_3_PORT:-49092}:9092"
    environment:
      <<: *common-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:${KAFKA_BROKER_3_PORT:-49092}
