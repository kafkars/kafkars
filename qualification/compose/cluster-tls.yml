services:
  kafka-1:
    volumes:
      - ${KAFKA_TLS_DIR:?set KAFKA_TLS_DIR}:/etc/kafka/secrets:ro
    environment: &tls-environment
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_TLS_PASSWORD:?set KAFKA_TLS_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_TLS_PASSWORD:?set KAFKA_TLS_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_PASSWORD:?set KAFKA_TLS_PASSWORD}
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: HTTPS

  kafka-2:
    volumes:
      - ${KAFKA_TLS_DIR:?set KAFKA_TLS_DIR}:/etc/kafka/secrets:ro
    environment: *tls-environment

  kafka-3:
    volumes:
      - ${KAFKA_TLS_DIR:?set KAFKA_TLS_DIR}:/etc/kafka/secrets:ro
    environment: *tls-environment
