name: Qualification

on:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  qualification-policy:
    name: qualification-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Validate qualification policy and renderer
        working-directory: kafka-client
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest qualification.test_render -v

  qualification-pr:
    name: qualification-pr-${{ matrix.kafka_version }}-${{ matrix.profile }}-${{ matrix.security }}
    if: ${{ github.event_name == 'pull_request' }}
    needs: [qualification-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { kafka_version: 4.3.1, profile: full, security: plaintext }
          - { kafka_version: 4.3.1, profile: share, security: plaintext }
          - { kafka_version: 4.2.1, profile: share, security: plaintext }
          - { kafka_version: 4.1.2, profile: share, security: plaintext }
          - { kafka_version: 4.2.1, profile: compatibility-smoke, security: plaintext }
          - { kafka_version: 4.1.2, profile: compatibility-smoke, security: plaintext }
          - { kafka_version: 4.0.2, profile: compatibility-smoke, security: plaintext }
          - { kafka_version: 3.9.2, profile: classic, security: plaintext }
          - { kafka_version: 3.8.1, profile: classic, security: plaintext }
          - { kafka_version: 3.7.2, profile: classic, security: plaintext }
          - { kafka_version: 4.3.1, profile: security-smoke, security: tls_custom }
          - { kafka_version: 4.3.1, profile: security-smoke, security: sasl_plaintext_plain }
          - { kafka_version: 4.3.1, profile: security-smoke, security: sasl_tls_custom_scram_sha_512 }
    defaults:
      run:
        working-directory: kafka-client
    steps:
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./kafka-client/.github/actions/setup-rust
      - name: Check out reviewed sibling dependencies
        uses: ./kafka-client/.github/actions/checkout-siblings
      - name: Run required pull-request qualification cell
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/qualification-pr-cell
          KAFKA_VERSION: ${{ matrix.kafka_version }}
          PROFILE: ${{ matrix.profile }}
          SECURITY: ${{ matrix.security }}
        run: scripts/run-qualification pr "$PROFILE" "$KAFKA_VERSION" "$SECURITY" "$EVIDENCE_ROOT"
      - name: Archive qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-pr-${{ matrix.kafka_version }}-${{ matrix.profile }}-${{ matrix.security }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-pr-cell
          if-no-files-found: warn
          retention-days: 14

  qualification-gate:
    name: qualification-gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [qualification-policy, qualification-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect real-broker evidence lane
        env:
          POLICY_RESULT: ${{ needs.qualification-policy.result }}
          QUALIFICATION_RESULT: ${{ needs.qualification-pr.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$QUALIFICATION_RESULT" = success
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Download pull-request qualification cells
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: qualification-pr-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-pr-cells
      - name: Merge and validate required pull-request evidence
        run: |
          cell_args=()
          while IFS= read -r -d '' cell; do
            cell_args+=(--cell "$cell")
          done < <(find qualification-pr-cells -type f -name compatibility.json -print0)
          test "${#cell_args[@]}" -gt 0
          kafka-client/scripts/render-qualification merge \
            --matrix kafka-client/qualification/matrix.json \
            "${cell_args[@]}" \
            --output qualification-pr-aggregate \
            --support kafka-client/SUPPORT.md \
            --require-complete-set pr \
            --require-qualified
      - name: Archive aggregate pull-request compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-pr-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-pr-aggregate
          if-no-files-found: error
          retention-days: 14

  qualification-matrix:
    name: qualification-${{ matrix.kafka_version }}-${{ matrix.profile }}-${{ matrix.security }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [qualification-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: ${{ ! matrix.gating }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { kafka_version: 4.3.1, profile: full, security: plaintext, gating: true }
          - { kafka_version: 4.3.1, profile: share, security: plaintext, gating: true }
          - { kafka_version: 4.2.1, profile: share, security: plaintext, gating: true }
          - { kafka_version: 4.1.2, profile: share, security: plaintext, gating: true }
          - { kafka_version: 4.3.1, profile: full, security: tls_custom, gating: true }
          - { kafka_version: 4.3.1, profile: full, security: sasl_plaintext_plain, gating: true }
          - { kafka_version: 4.3.1, profile: full, security: sasl_plaintext_scram_sha_256, gating: true }
          - { kafka_version: 4.3.1, profile: full, security: sasl_plaintext_scram_sha_512, gating: true }
          - { kafka_version: 4.3.1, profile: full, security: sasl_tls_custom_plain, gating: true }
          - { kafka_version: 4.3.1, profile: full, security: sasl_tls_custom_scram_sha_256, gating: true }
          - { kafka_version: 4.3.1, profile: full, security: sasl_tls_custom_scram_sha_512, gating: true }
          - { kafka_version: 4.2.1, profile: full, security: plaintext, gating: true }
          - { kafka_version: 4.1.2, profile: full, security: plaintext, gating: true }
          - { kafka_version: 4.0.2, profile: full, security: plaintext, gating: true }
          - { kafka_version: 3.9.2, profile: classic, security: plaintext, gating: false }
          - { kafka_version: 3.8.1, profile: classic, security: plaintext, gating: false }
          - { kafka_version: 3.7.2, profile: classic, security: plaintext, gating: false }
    defaults:
      run:
        working-directory: kafka-client
    steps:
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./kafka-client/.github/actions/setup-rust
      - name: Check out reviewed sibling dependencies
        uses: ./kafka-client/.github/actions/checkout-siblings
      - name: Run scheduled qualification cell
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/qualification-cell
          KAFKA_VERSION: ${{ matrix.kafka_version }}
          PROFILE: ${{ matrix.profile }}
          SECURITY: ${{ matrix.security }}
        run: scripts/run-qualification nightly "$PROFILE" "$KAFKA_VERSION" "$SECURITY" "$EVIDENCE_ROOT"
      - name: Archive qualification cell
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-cell-${{ matrix.kafka_version }}-${{ matrix.profile }}-${{ matrix.security }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-cell
          if-no-files-found: warn
          retention-days: 30

  qualification-aggregate:
    name: qualification-aggregate
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [qualification-policy, qualification-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: kafka-client
          persist-credentials: false
      - name: Download qualification cells
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: qualification-cell-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-cells
      - name: Merge and validate complete matrix evidence
        env:
          POLICY_RESULT: ${{ needs.qualification-policy.result }}
        run: |
          if [[ "$POLICY_RESULT" != success ]]; then
            echo "qualification policy ended with: $POLICY_RESULT" >&2
            exit 1
          fi
          cell_args=()
          while IFS= read -r -d '' cell; do
            cell_args+=(--cell "$cell")
          done < <(find qualification-cells -type f -name compatibility.json -print0)
          test "${#cell_args[@]}" -gt 0
          kafka-client/scripts/render-qualification merge \
            --matrix kafka-client/qualification/matrix.json \
            "${cell_args[@]}" \
            --output qualification-aggregate \
            --support kafka-client/SUPPORT.md \
            --require-complete-set nightly \
            --require-qualified
      - name: Archive aggregate compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-aggregate
          if-no-files-found: warn
          retention-days: 90
