name: Qualification

on:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualification-pr:
    name: qualification-gate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Kafkars
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Qualify pull request with Testlab
        uses: kafkars/testlab@47edc92118064389f9b7e5ed8ad08deb7a05b8e5
        with:
          kafkars-path: ${{ github.workspace }}
          qualification: pr
          evidence-directory: testlab-evidence
      - name: Archive pull-request qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testlab-pr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: testlab-evidence
          if-no-files-found: error
          retention-days: 14

  qualification-release:
    name: release-qualification-gate
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: kafkars/testlab/.github/workflows/qualification-release.yml@47edc92118064389f9b7e5ed8ad08deb7a05b8e5
    with:
      testlab-ref: 47edc92118064389f9b7e5ed8ad08deb7a05b8e5
