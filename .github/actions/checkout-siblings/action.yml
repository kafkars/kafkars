name: Check out sibling dependencies
description: Materialize the reviewed public driver and wire commits beside the client.

runs:
  using: composite
  steps:
    - name: Read reviewed revisions
      id: revisions
      shell: bash
      run: |
        set -euo pipefail
        revision_file="$GITHUB_ACTION_PATH/../../../dependencies/sibling-revisions.env"
        source "$revision_file"
        if [[ ! "$KAFKA_DRIVER_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
          echo "invalid kafka-driver revision" >&2
          exit 1
        fi
        if [[ ! "$KAFKA_PROTOCOL_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
          echo "invalid kafka-protocol revision" >&2
          exit 1
        fi
        {
          echo "driver=$KAFKA_DRIVER_REVISION"
          echo "protocol=$KAFKA_PROTOCOL_REVISION"
        } >> "$GITHUB_OUTPUT"
    - name: Check out kafka-driver
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: kafkars/kafka-driver
        ref: ${{ steps.revisions.outputs.driver }}
        path: kafka-driver
        persist-credentials: false
    - name: Check out kafka-wire
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: kafkars/kafka-wire
        ref: ${{ steps.revisions.outputs.protocol }}
        path: kafka-protocol
        persist-credentials: false
