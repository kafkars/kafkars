[[dependency_rules]]
package = "kafka-client-core"
allowed_internal = []
allowed_external = []

[[dependency_rules]]
package = "kafka-client-engine"
allowed_internal = ["kafka-client-core"]
# kafka-wire-core is an exact normal edge because the engine exhaustively
# classifies wire encode/decode failures carried by kafka-driver. The sibling
# manifest guard rejects dev/build/target redeclarations and aliases.
allowed_external = [
  "bytes",
  "kafka-driver",
  "kafka-wire",
  "kafka-wire-core",
  "kafka-wire-records",
]

[[dependency_rules]]
package = "kafka-client-guardrails"
allowed_internal = []
allowed_external = ["serde", "syn", "toml"]

[[dependency_rules]]
package = "kafka-client-sim"
allowed_internal = ["kafka-client-core"]
allowed_external = []

[[dependency_rules]]
package = "kafka-client-rs"
allowed_internal = ["kafka-client-engine"]
allowed_external = ["bytes"]

# Time, I/O, execution, and protocol bytes stay outside deterministic policy.
[[capability_rules]]
root = "crates/kafka-client-core/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::sync",
  "std::thread",
  "std::time",
  "async_std",
  "kafka_driver",
  "kafka_wire",
  "smol",
  "tokio",
]

# Admin state owns only normalized policy facts, never sibling-domain policy.
[[capability_rules]]
root = "crates/kafka-client-core/src/admin"
forbidden = [
  "crate::consumer",
  "crate::producer",
  "crate::transaction",
  "kafka_driver",
  "kafka_wire",
  "std::future",
  "std::time",
]

# Direct assignment owns no group, protocol, transport, or sibling policy.
[[capability_rules]]
root = "crates/kafka-client-core/src/consumer"
forbidden = [
  "crate::admin",
  "crate::producer",
  "crate::transaction",
  "kafka_driver",
  "kafka_wire",
  "std::future",
  "std::time",
]

# Simulation owns virtual time only and must remain reproducible.
[[capability_rules]]
root = "crates/kafka-client-sim/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::thread",
  "std::time",
  "async_std",
  "kafka_driver",
  "kafka_wire",
  "smol",
  "tokio",
]

# The engine may own clocks and threads, but the driver owns socket mechanics.
[[capability_rules]]
root = "crates/kafka-client-engine/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::sync::mpsc::channel",
  "async_std",
  "smol",
  "tokio",
]
allow = [
  { path = "crates/kafka-client-engine/src/silent_broker_test.rs", capability = "std::net", reason = "A silent loopback listener makes driver deadline evidence deterministic without production socket ownership." },
  { path = "crates/kafka-client-engine/src/driver/rpc/fetch/routed_response_broker_test.rs", capability = "std::net", reason = "One test-only loopback Kafka fixture proves real driver route-token ownership without exposing sockets to production or scenario code." },
]

