# Lifecycle and accounting owners must not be duplicated accidentally.
[[linear_owners]]
owner_type = "ProducerMachine"
path = "crates/kafka-client-core/src/producer/machine.rs"

[[linear_owners]]
owner_type = "CompletionLedger"
