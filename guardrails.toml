# Concrete direct-Fetch execution uses the engine port without acquiring raw
# protocol, transport, clock, async, metadata, or sibling-domain authority.
[[capability_rules]]
root = "crates/kafka-client-engine/src/consumer/fetch_execution"
forbidden = [
  "crate::admin",
  "crate::producer",
  "crate::transaction",
  "kafka_driver",
  "kafka_wire",
  "kafka_wire_core",
  "kafka_wire_records",
  "std::future",
  "std::time",
  "Instant::now",
  "Future",
  "async",
  "Transport",
  "Retry",
  "Metadata",
]
allow = [
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/admission_test.rs", capability = "std::time", reason = "Test-only absolute deadlines exercise pre-admission expiry without granting production clock ownership." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/admission_test.rs", capability = "Instant::now", reason = "Test-only absolute deadlines exercise pre-admission expiry without granting production clock ownership." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/control_test.rs", capability = "std::time", reason = "Test-only live driver deadlines prove control fencing without granting production clock ownership." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/control_test.rs", capability = "Instant::now", reason = "Test-only live driver deadlines prove control fencing without granting production clock ownership." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/deadline.rs", capability = "std::time", reason = "The linear attempt owner accepts one configured duration while delegating the sole monotonic observation to the engine clock." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/deadline_test.rs", capability = "std::time", reason = "Test-only duration input proves one internal attempt capture without granting production clock ownership." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/deadline_test.rs", capability = "Instant::now", reason = "Test-only boundary bracketing proves the transport absolute came from the same internal attempt capture." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/fault_test.rs", capability = "std::time", reason = "Test-only driver timeout duration exercises explicit shutdown recovery without production clock ownership." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/settlement_test.rs", capability = "std::time", reason = "Test-only absolute driver deadlines exercise terminal settlement without granting production clock ownership." },
  { path = "crates/kafka-client-engine/src/consumer/fetch_execution/settlement_test.rs", capability = "Instant::now", reason = "Test-only absolute driver deadlines exercise terminal settlement without granting production clock ownership." },
]

