schema = 3

forbidden_transitive_dependencies = [
  "actix-rt",
  "async-executor",
  "async-global-executor",
  "async-std",
  "compio",
  "embassy-executor",
  "futures-executor",
  "glommio",
  "monoio",
  "smol",
  "tokio",
]

[paths]
rust_roots = ["crates"]
# These are deliberately invalid Rust shapes used to prove each detector.
excluded_roots = ["crates/kafka-client-guardrails/tests/fixtures"]

[budgets]
baseline = [
  { path = "crates/kafka-client-engine/src/producer/pending/mod.rs", lines = 85, reason = "declarative facade explicitly registers its sibling pending-domain test modules" },
]
allow = []

[budgets.facade]
target = 80
soft = 120
hard = 180

[budgets.implementation]
target = 240
soft = 360
hard = 500

[budgets.test]
target = 300
soft = 500
hard = 700

[budgets.auxiliary]
target = 300
soft = 500
hard = 700

# Load-bearing modules keep their executable evidence as declared siblings.
[[test_mirrors]]
production = "crates/kafka-client-core/src/capacity.rs"
