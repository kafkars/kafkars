schema = 3

forbidden_transitive_dependencies = [
  "actix-rt",
  "async-executor",
  "async-global-executor",
  "async-std",
  "compio",
  "embassy-executor",
  "futures-executor",
  "glommio",
  "monoio",
  "smol",
  "tokio",
]

authority_tokens = []

[paths]
rust_roots = ["crates"]
# These are deliberately invalid Rust shapes used to prove each detector.
excluded_roots = ["crates/kafka-client-guardrails/tests/fixtures"]

[budgets]
baseline = [
  { path = "crates/kafka-client-engine/src/admin/mod.rs", lines = 96, reason = "The declarative root registers the new nested DescribeConfigs domain while legacy admin domains remain flat; this exact baseline cannot grow and must shrink as those domains gain their own facades." },
]
allow = []

[budgets.facade]
target = 80
soft = 120
hard = 180

[budgets.implementation]
target = 240
soft = 360
hard = 500

[budgets.test]
target = 300
soft = 500
hard = 700

[budgets.auxiliary]
target = 300
soft = 500
hard = 700

