# Time, I/O, execution, and protocol bytes stay outside deterministic policy.
[[capability_rules]]
root = "crates/kafka-client-core/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::sync",
  "std::thread",
  "std::time",
  "async_std",
  "kafka_driver",
  "kafka_wire",
  "smol",
  "tokio",
]

# Admin state owns only normalized policy facts, never sibling-domain policy.
[[capability_rules]]
root = "crates/kafka-client-core/src/admin"
forbidden = [
  "crate::consumer",
  "crate::producer",
  "crate::transaction",
  "kafka_driver",
  "kafka_wire",
  "std::future",
  "std::time",
]

# Direct assignment owns no group, protocol, transport, or sibling policy.
[[capability_rules]]
root = "crates/kafka-client-core/src/consumer"
forbidden = [
  "crate::admin",
  "crate::producer",
  "crate::transaction",
  "kafka_driver",
  "kafka_wire",
  "std::future",
  "std::time",
]

# Simulation owns virtual time only and must remain reproducible.
