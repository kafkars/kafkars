[[capability_rules]]
root = "crates/kafka-client-engine/src/driver/rpc/classic_group"
forbidden = [
  "ClassicGroupEffect",
  "ClassicGroupInput",
  "ClassicGroupMachine",
  "Instant::now",
  "Retry",
  "Route::Coordinator",
  "async",
  "crate::protocol",
  "invalidate",
  "normalize",
  "std::future",
  "std::net",
  "std::thread",
]
allow = [
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/join_group_calls.rs", capability = "crate::protocol", reason = "The exact Join call permit is the sole production boundary allowed to consume the opaque prepared protocol request." },
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/sync_group_calls.rs", capability = "crate::protocol", reason = "The exact Sync call permit is the sole production boundary allowed to consume the opaque prepared protocol request." },
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/heartbeat_calls.rs", capability = "crate::protocol", reason = "The exact Heartbeat call permit is the sole production boundary allowed to consume the opaque prepared protocol request." },
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/join_group_terminal_test.rs", capability = "Instant::now", reason = "Tests create an inert transport deadline without acquiring production clock authority." },
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/sync_group_terminal_test.rs", capability = "Instant::now", reason = "Tests create an inert transport deadline without acquiring production clock authority." },
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/heartbeat_terminal_test.rs", capability = "Instant::now", reason = "Tests create an inert transport deadline without acquiring production clock authority." },
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/heartbeat_test_fixture.rs", capability = "ClassicGroupEffect", reason = "This cfg(test)-only fixture interprets exact core effects to derive two distinct real Heartbeat attempt identities." },
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/heartbeat_test_fixture.rs", capability = "ClassicGroupInput", reason = "This cfg(test)-only fixture drives explicit deterministic core inputs to derive real Heartbeat attempt identities." },
  { path = "crates/kafka-client-engine/src/driver/rpc/classic_group/heartbeat_test_fixture.rs", capability = "ClassicGroupMachine", reason = "This cfg(test)-only fixture owns an isolated deterministic machine solely to derive real Heartbeat attempt identities." },
]

