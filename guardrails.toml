schema = 3

forbidden_transitive_dependencies = [
  "actix-rt",
  "async-executor",
  "async-global-executor",
  "async-std",
  "compio",
  "embassy-executor",
  "futures-executor",
  "glommio",
  "monoio",
  "smol",
  "tokio",
]

authority_tokens = []

[paths]
rust_roots = ["crates"]
# These are deliberately invalid Rust shapes used to prove each detector.
excluded_roots = ["crates/kafka-client-guardrails/tests/fixtures"]

[budgets]
baseline = [
  { path = "crates/kafka-client-engine/src/admin/mod.rs", lines = 95, reason = "The nearest declarative facade explicitly test-gates every concrete admin sibling; this exact baseline must shrink when domains gain nested facades." },
]
allow = []

[budgets.facade]
target = 80
soft = 120
hard = 180

[budgets.implementation]
target = 240
soft = 360
hard = 500

[budgets.test]
target = 300
soft = 500
hard = 700

[budgets.auxiliary]
target = 300
soft = 500
hard = 700

# Load-bearing modules keep their executable evidence as declared siblings.
