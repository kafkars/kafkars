# The engine may own clocks and threads, but the driver owns socket mechanics.
[[capability_rules]]
root = "crates/kafka-client-engine/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::sync::mpsc::channel",
  "async_std",
  "smol",
  "tokio",
]
allow = [
  { path = "crates/kafka-client-engine/src/silent_broker_test.rs", capability = "std::net", reason = "A silent loopback listener makes driver deadline evidence deterministic without production socket ownership." },
  { path = "crates/kafka-client-engine/src/driver/rpc/describe_cluster_calls_test.rs", capability = "std::net", reason = "One test-only loopback Kafka fixture proves generated DescribeCluster call ownership and settlement without exposing sockets to production code." },
  { path = "crates/kafka-client-engine/src/driver/rpc/fetch/routed_response_broker_test.rs", capability = "std::net", reason = "One test-only loopback Kafka fixture proves real driver route-token ownership without exposing sockets to production or scenario code." },
  { path = "crates/kafka-client-engine/src/consumer/group_commit/observer_test.rs", capability = "std::sync::mpsc::channel", reason = "A test-only channel records one off-thread wake so Future observation can be proven against the same recovered terminal as blocking wait." },
