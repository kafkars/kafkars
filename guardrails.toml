forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::sync::Condvar",
  "std::sync::Mutex",
  "std::sync::RwLock",
  "std::thread",
  "async_std",
  "kafka_client_core",
  "kafka_driver",
  "kafka_wire",
  "kafka_wire_records",
  "smol",
  "tokio",
]
allow = [
  { path = "crates/kafkars/src/silent_broker_test.rs", capability = "std::net", reason = "A test-only silent loopback listener proves the public timeout translation without exposing a production test hook." },
  { path = "crates/kafkars/src/silent_broker_test.rs", capability = "std::thread", reason = "The test broker completes negotiation off the client reactor and joins before the scenario exits." },
  { path = "crates/kafkars/src/producer/send_batch_test.rs", capability = "std::thread", reason = "The public prefix-admission proof delays only its caller while retrying deliberately forced shard contention." },
  { path = "crates/kafkars/src/consumer/group_startup_error_test.rs", capability = "std::thread", reason = "The public retained-startup proof delays only its caller while polling the accepted membership terminal." },
  { path = "crates/kafkars/src/bridge/client_shutdown/state.rs", capability = "std::sync::Condvar", reason = "The bounded clone-shared shutdown terminal provides a runtime-neutral blocking adapter without borrowing an executor." },
  { path = "crates/kafkars/src/bridge/client_shutdown/state.rs", capability = "std::sync::Mutex", reason = "The facade retains one bounded shutdown phase and observer registry shared across client clones." },
  { path = "crates/kafkars/src/bridge/client_shutdown/state.rs", capability = "std::thread", reason = "One named native waiter observes engine termination and publishes user wakers away from reactor threads." },
  { path = "crates/kafkars/src/bridge/client_shutdown_test.rs", capability = "std::thread", reason = "The focused bridge scenario proves concurrent callers observe one retained shutdown terminal." },
]

