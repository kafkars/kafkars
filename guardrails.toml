[[dependency_rules]]
package = "kafka-client-core"
allowed_internal = []
allowed_external = []

[[dependency_rules]]
package = "kafka-client-engine"
allowed_internal = ["kafka-client-core"]
allowed_external = ["bytes", "kafka-driver", "kafka-wire", "kafka-wire-records"]

[[dependency_rules]]
package = "kafka-client-guardrails"
allowed_internal = []
allowed_external = ["serde", "syn", "toml"]

[[dependency_rules]]
package = "kafka-client-sim"
allowed_internal = ["kafka-client-core"]
allowed_external = []

[[dependency_rules]]
package = "kafka-client-rs"
allowed_internal = ["kafka-client-engine"]
allowed_external = ["bytes"]

# Time, I/O, execution, and protocol bytes stay outside deterministic policy.
[[capability_rules]]
root = "crates/kafka-client-core/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::sync",
  "std::thread",
  "std::time",
  "async_std",
  "kafka_driver",
  "kafka_wire",
  "smol",
  "tokio",
]

# Simulation owns virtual time only and must remain reproducible.
[[capability_rules]]
root = "crates/kafka-client-sim/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::thread",
  "std::time",
  "async_std",
  "kafka_driver",
  "kafka_wire",
  "smol",
  "tokio",
]

# The engine may own clocks and threads, but the driver owns socket mechanics.
[[capability_rules]]
root = "crates/kafka-client-engine/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::sync::mpsc::channel",
  "async_std",
  "smol",
  "tokio",
]

# Reactor-driving driver adapters never touch observer locks or wakers.
[[capability_rules]]
root = "crates/kafka-client-engine/src/driver"
forbidden = [
