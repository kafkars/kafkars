schema = 3

forbidden_transitive_dependencies = [
  "actix-rt",
  "async-executor",
  "async-global-executor",
  "async-std",
  "compio",
  "embassy-executor",
  "futures-executor",
  "glommio",
  "monoio",
  "smol",
  "tokio",
]

[[authority_tokens]]
owner_type = "CandidateMember"
path = "crates/kafka-client-engine/src/consumer/group/classic_group_candidate.rs"
fields = [
  "joined_slot",
  "normalized_member_id",
  "ordering_rank",
  "kafka_member_spelling",
  "subscribed_topic_ids",
]
allowed_paths = [
  "crates/kafka-client-engine/src/consumer/group/classic_group_candidate.rs",
]

[[authority_tokens]]
owner_type = "ClassicGroupCycleCandidate"
path = "crates/kafka-client-engine/src/consumer/group/classic_group_candidate.rs"
fields = [
  "membership_cycle",
  "local_catalog_member_id",
  "local_kafka_member",
  "local_joined_slot",
  "ranked_members",
  "foreign_topic_bindings",
  "member_cursor_after_install",
  "topic_cursor_after_install",
  "retained_topic_bytes_after_install",
  "base_member_cursor",
  "base_topic_cursor",
  "base_topic_count",
  "base_topic_name_bytes",
  "local_topic_ids",
]
allowed_paths = [
  "crates/kafka-client-engine/src/consumer/group/classic_group_candidate.rs",
]

[paths]
rust_roots = ["crates"]
# These are deliberately invalid Rust shapes used to prove each detector.
excluded_roots = ["crates/kafka-client-guardrails/tests/fixtures"]

[budgets]
baseline = [
]
allow = []

[budgets.facade]
target = 80
soft = 120
hard = 180

[budgets.implementation]
target = 240
soft = 360
hard = 500

[budgets.test]
target = 300
soft = 500
hard = 700

[budgets.auxiliary]
target = 300
soft = 500
hard = 700

