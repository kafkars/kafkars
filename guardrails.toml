[[dependency_rules]]
package = "kafka-client-core"
allowed_internal = []
# API-38 delegation-token results cross deterministic terminal ownership with
# uniquely owned HMAC bytes. Zeroize is the sole release barrier for that
# secret; it adds no runtime, I/O, cryptography, or callback authority.
allowed_external = ["zeroize"]

[[dependency_rules]]
package = "kafka-client-engine"
allowed_internal = ["kafka-client-core"]
# kafka-wire-core is an exact normal edge because the engine exhaustively
# classifies wire encode/decode failures carried by kafka-driver. Ring is the
# sole PBKDF2 and secure-random owner for password-based SCRAM administration;
# plaintext derivation finishes before reactor admission. The sibling manifest
# guard rejects dev/build/target redeclarations and aliases.
allowed_external = [
  "bytes",
  "kafka-driver",
  "kafka-wire",
  "kafka-wire-core",
  "kafka-wire-records",
  "ring",
  "rustls",
  "rustls-native-certs",
  "zeroize",
]

[[dependency_rules]]
package = "kafka-client-guardrails"
allowed_internal = []
allowed_external = ["serde", "syn", "toml"]

[[dependency_rules]]
package = "kafka-client-sim"
allowed_internal = ["kafka-client-core"]
allowed_external = []

[[dependency_rules]]
package = "kafkars"
allowed_internal = ["kafka-client-engine"]
# The wire edges are test-only: the public loopback qualification harness
# speaks generated Kafka frames while production remains isolated by the
# facade dependency boundary guard.
allowed_external = [
  "bytes",
  "kafka-wire",
  "kafka-wire-core",
  "zeroize",
]

# Time, I/O, execution, and protocol bytes stay outside deterministic policy.
[[capability_rules]]
root = "crates/kafka-client-core/src"
forbidden = [
  "std::fs",
  "std::net",
  "std::os::unix::net",
  "std::process",
  "std::sync",
  "std::thread",
  "std::time",
  "async_std",
  "kafka_driver",
  "kafka_wire",
  "smol",
  "tokio",
]

# Admin state owns only normalized policy facts, never sibling-domain policy.
[[capability_rules]]
root = "crates/kafka-client-core/src/admin"
forbidden = [
  "crate::consumer",
  "crate::producer",
  "crate::transaction",
  "kafka_driver",
  "kafka_wire",
  "std::future",
  "std::time",
]

# Transaction initialization owns scalar policy only, never retained names or execution.
[[capability_rules]]
root = "crates/kafka-client-core/src/transaction"
forbidden = [
  "crate::admin",
  "crate::consumer",
  "crate::driver",
  "crate::producer",
  "Callback",
